<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You... 🤍</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #d63031;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p {
            color: #636e72;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #27ae60;
        }

        #noBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
            /* Set initial position for the No button */
            right: 60px; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bro boleh tukar text kat bawah ni ikut kesesuaian -->
        <h1>Hi Lala... 🤍</h1>
        <p id="message">Since we've been talking, I just want to ask... do you mind if I keep getting to know you better? 🥰</p>

        <div class="buttons">
            <button id="yesBtn" onclick="selectYes()">Yes</button>
            <button id="noBtn" onmouseover="flyAway()" onclick="flyAway()">No</button>
        </div>
    </div>

    <script>
        function flyAway() {
            const noBtn = document.getElementById('noBtn');
            
            // Dapatkan saiz tetingkap browser
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Dapatkan posisi rawak (random) dalam skrin
            // Tolak 100-150px supaya butang tak lari keluar dari sempadan skrin
            const randomX = Math.floor(Math.random() * (windowWidth - 150));
            const randomY = Math.floor(Math.random() * (windowHeight - 100));
            
            // Tukar posisi butang menjadi 'fixed' supaya dia boleh lari ke mana-mana sahaja di skrin
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function selectYes() {
            const message = document.getElementById('message');
            const buttonsContainer = document.querySelector('.buttons');
            const h1 = document.querySelector('h1');
            
            // Tukar skrin bila dia berjaya tekan "Yes"
            h1.innerHTML = "Thank you! 🥰";
            message.innerHTML = "Hehe, glad you said yes. Let's focus on our studies and careers, and let the time answer the rest. Semangat study tau! 📚💪";
            
            // Sorokkan butang-butang selepas selesai
            buttonsContainer.style.display = 'none';
        }
    </script>

</body>
</html>2
